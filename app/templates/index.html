<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathFinder Pro | Calculadora</title>

    <script>const storedTheme=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',storedTheme);</script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body { overflow: hidden; padding-top: 0; }
        #map { width: 100vw; height: 100vh; z-index: 1; background: #222; /* Fondo oscuro mientras carga */ }
        .sidebar-float { position: absolute; top: 80px; left: 20px; width: 380px; max-height: calc(100vh - 120px); overflow-y: visible; z-index: 1000; padding: 20px; border-radius: 16px; transition: background 0.3s; }
        .autocomplete-container { position: relative; }
    </style>
</head>
<body>

<nav class="navbar navbar-glass fixed-top px-4 shadow-sm" style="top: 0;">
    <a class="navbar-brand fw-bold small text-uppercase d-flex align-items-center" href="{{ url_for('views.dashboard') }}">
        <div class="btn btn-sm btn-white rounded-pill me-2 px-3 shadow-sm">
            <i class="fas fa-arrow-left me-1"></i> Dashboard
        </div>
    </a>
    <div class="ms-auto d-flex gap-2">
        <button class="btn btn-sm btn-white rounded-circle shadow-sm" id="mapThemeToggle" style="width: 38px; height: 38px;">
            <i class="fas fa-adjust"></i>
        </button>
        <button onclick="clearMapData()" class="btn btn-sm btn-danger fw-bold rounded-pill px-3 shadow-sm">
            <i class="fas fa-trash-alt me-1"></i> Reiniciar
        </button>
    </div>
</nav>

<div class="sidebar-float bg-white shadow-lg animate__animated animate__fadeInLeft">

    <div id="step1" class="step-section step-active">
        <div class="step-header">
            <div class="step-number">1</div>
            <span class="step-title">Puntos de Ruta</span>
        </div>
        <div class="p-3 rounded-3 border bg-light bg-opacity-50">
            <small class="text-muted d-block mb-2 fw-bold" style="font-size:0.7rem">HAZ CLIC O BUSCA UN LUGAR</small>

            <div class="autocomplete-container mb-2">
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0"><i class="fas fa-search text-muted"></i></span>
                    <input type="text" id="nodeName" class="form-control border-start-0 ps-0" placeholder="Buscar..." autocomplete="off">
                </div>
                <div id="nodeSuggestions" class="suggestions-list" style="display:none;"></div>
            </div>

            <div class="d-flex gap-2 mb-3">
                <input type="text" id="nodeLat" class="form-control form-control-sm border-0 text-muted bg-transparent" placeholder="Latitud" readonly>
                <input type="text" id="nodeLng" class="form-control form-control-sm border-0 text-muted bg-transparent" placeholder="Longitud" readonly>
            </div>

            <button onclick="addNode()" class="btn btn-dark w-100 rounded-pill py-2 shadow-sm hover-scale">
                <i class="fas fa-plus me-2"></i> Agregar
            </button>

            <div class="mt-3 pt-2 border-top border-secondary border-opacity-10 d-flex align-items-center justify-content-between">
                <span class="small text-muted" id="pointsCount">0 puntos</span>
                <div class="input-group input-group-sm w-50">
                    <input type="text" id="deleteNodeName" class="form-control border-end-0 bg-transparent" placeholder="Nombre">
                    <button onclick="deleteNode()" class="btn btn-outline-danger border-start-0"><i class="fas fa-times"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="step2" class="step-section disabled">
        <div class="step-header">
            <div class="step-number">2</div>
            <span class="step-title">Conexiones</span>
        </div>
        <div class="p-3 rounded-3 border border-dashed bg-light bg-opacity-25">
            <div class="d-flex align-items-center gap-2 mb-2">
                <input type="text" id="edgeFrom" class="form-control form-control-sm text-center fw-bold" placeholder="A">
                <i class="fas fa-arrow-right text-muted opacity-50"></i>
                <input type="text" id="edgeTo" class="form-control form-control-sm text-center fw-bold" placeholder="B">
            </div>
            <button onclick="addEdge()" class="btn btn-outline-primary w-100 rounded-pill btn-sm">
                <i class="fas fa-link me-1"></i> Conectar
            </button>
        </div>
    </div>

    <div id="step3" class="step-section disabled">
        <div class="step-header">
            <div class="step-number" style="background: var(--primary);">3</div>
            <span class="step-title text-primary">Calcular Ruta</span>
        </div>
        <div class="bg-primary bg-opacity-10 p-3 rounded-3 border border-primary border-opacity-25 shadow-sm">
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="small text-muted fw-bold opacity-75" style="font-size:0.65rem">ORIGEN</label>
                    <input type="text" id="startNode" class="form-control form-control-sm fw-bold text-success border-success" placeholder="Inicio">
                </div>
                <div class="col-6">
                    <label class="small text-muted fw-bold opacity-75" style="font-size:0.65rem">DESTINO</label>
                    <input type="text" id="endNode" class="form-control form-control-sm fw-bold text-danger border-danger" placeholder="Fin">
                </div>
            </div>
            <button onclick="calculatePath()" class="btn btn-gradient-primary w-100 py-3 rounded-pill shadow-lg hover-scale">
                <span class="fw-bold h6 m-0"><i class="fas fa-rocket me-2"></i>CALCULAR</span>
            </button>
        </div>
    </div>
</div>

<div class="map-legend animate__animated animate__fadeInUp bg-white">
    <div class="legend-item"><div class="legend-dot" style="background:#22C55E"></div> Origen</div>
    <div class="legend-item"><div class="legend-dot" style="background:#EF4444"></div> Destino</div>
    <div class="legend-item"><div class="legend-dot" style="background:#3B82F6"></div> Intermedio</div>
    <div class="legend-item"><div class="legend-dot" style="background:#6366F1; box-shadow:0 0 5px #6366F1;"></div> Ruta</div>
</div>

<div id="resultCard" class="result-card-float bg-white">
    <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
            <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 mb-1">¡Ruta Lista!</span>
            <h5 class="fw-bold mb-0 text-dark">Resumen</h5>
        </div>
        <button onclick="closeResultCard()" class="btn-close btn-sm"></button>
    </div>
    <div class="d-flex align-items-center mb-3">
        <div class="me-3 text-center bg-light bg-opacity-50 rounded-circle p-3"><i class="fas fa-route fa-2x text-primary"></i></div>
        <div>
            <h2 class="fw-bold mb-0 text-dark" id="resDistance">0.0 km</h2>
            <div class="text-muted small fw-bold"><i class="fas fa-clock me-1 text-warning"></i> <span id="resTime">0 min</span></div>
        </div>
    </div>
    <hr class="opacity-10">
    <button onclick="closeResultCard()" class="btn btn-outline-dark w-100 rounded-pill btn-sm">Ver detalles</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script> const CURRENT_USER_KEY = "pathfinder_data_{{ user }}"; </script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script>
    // Lógica para el botón de tema (ahora incluido en la navbar)
    document.getElementById('mapThemeToggle').addEventListener('click', () => {
        const h = document.documentElement;
        const n = h.getAttribute('data-theme')==='dark'?'light':'dark';
        h.setAttribute('data-theme', n);
        localStorage.setItem('theme', n);
    });
    function closeResultCard() { document.getElementById('resultCard').style.display = 'none'; }
</script>
</body>
</html>
