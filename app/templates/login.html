<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
             background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .login-container { max-width: 450px; width: 90%; }
    </style>
</head>
<body>
    <div class="login-container animate__animated animate__fadeInUp">
        <div class="text-center mb-4 animate__animated animate__fadeInDown animate__delay-1s">
             <i class="fas fa-map-marked-alt fa-3x text-primary" style="filter: drop-shadow(0 4px 6px rgba(102, 126, 234, 0.5));"></i>
             <h2 class="fw-bold mt-2">Bienvenido de nuevo</h2>
        </div>

        <div class="glass-card p-4 p-md-5 hover-scale">

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">
                            <i class="fas fa-info-circle me-2"></i>{{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <h4 class="text-center mb-4 fw-bold" style="color: var(--dark-text);">Iniciar Sesión</h4>

            <form method="POST">
                <div class="mb-4 input-group animate__animated animate__fadeIn animate__delay-1s">
                    <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--glass-border);"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" name="username" class="form-control form-control-glass border-start-0 ps-0" placeholder="Nombre de usuario" required>
                </div>
                <div class="mb-4 input-group animate__animated animate__fadeIn animate__delay-2s">
                    <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--glass-border);"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control form-control-glass border-start-0 ps-0" placeholder="Contraseña" required>
                </div>

                <div class="d-grid animate__animated animate__fadeInUp animate__delay-3s">
                    <button type="submit" class="btn btn-gradient-primary btn-lg rounded-pill shadow py-3">
                        Entrar <i class="fas fa-arrow-right ms-2"></i>
                    </button>
                </div>
            </form>

            <hr class="my-4 opacity-25">
            <div class="text-center animate__animated animate__fadeIn animate__delay-3s">
                <p class="small text-muted mb-2">¿No tienes cuenta?</p>
                <a href="{{ url_for('views.register') }}" class="btn btn-outline-primary btn-sm rounded-pill w-100">
                    Crear cuenta nueva
                </a>
            </div>

        </div>
        <div class="text-center mt-4 animate__animated animate__fadeIn animate__delay-3s">
            <a href="{{ url_for('views.home') }}" class="text-muted text-decoration-none small"><i class="fas fa-chevron-left me-1"></i> Volver al inicio</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
