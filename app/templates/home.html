<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - PathFinder Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .hero-section { min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .hero-shape { position: absolute; opacity: 0.1; z-index: -1; }
    </style>
</head>
<body>
    <div class="hero-shape animate__animated animate__pulse animate__infinite animate__slower" style="top: -10%; left: -10%; color: #667eea;"><i class="fas fa-map fa-10x"></i></div>
    <div class="hero-shape animate__animated animate__pulse animate__infinite animate__slower animate__delay-2s" style="bottom: -5%; right: -5%; color: #764ba2;"><i class="fas fa-route fa-10x"></i></div>

    <div class="hero-section container">
        <div class="row align-items-center">
            <div class="col-lg-8 mx-auto text-center pt-5">
                <div class="glass-card p-5 animate__animated animate__zoomInDown">
                    <div class="mb-4 animate__animated animate__fadeInDown animate__delay-1s">
                        <i class="fas fa-bezier-curve fa-4x text-primary mb-3" style="background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
                    </div>
                    <h1 class="display-3 fw-extrabold mb-3 animate__animated animate__fadeInUp animate__delay-1s">PathFinder <span style="color: #764ba2;">Pro</span></h1>
                    <p class="lead text-muted mb-5 animate__animated animate__fadeInUp animate__delay-1s">
                        La herramienta definitiva para calcular rutas óptimas entre ciudades utilizando el algoritmo de Dijkstra y datos geoespaciales reales.
                    </p>

                    <div class="d-grid gap-3 d-sm-flex justify-content-sm-center animate__animated animate__fadeInUp animate__delay-2s">
                        <a href="{{ url_for('views.login') }}" class="btn btn-gradient-primary btn-lg px-5 py-3 rounded-pill shadow-lg">
                            <i class="fas fa-rocket me-2"></i> Ingresar a la App
                        </a>
                        <a href="{{ url_for('views.docs') }}" class="btn btn-outline-dark btn-lg px-5 py-3 rounded-pill hover-scale">
                            <i class="fas fa-book me-2"></i> Guía rápida
                        </a>
                    </div>
                </div>
                <p class="mt-4 text-muted small animate__animated animate__fadeIn animate__delay-3s">Versión 2.1 | Desarrollado con Flask & Leaflet</p>
            </div>
        </div>
    </div>
</body>
</html>
